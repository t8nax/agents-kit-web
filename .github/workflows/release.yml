# Выпуск Беты: код пришёл в dev — сборка ложится в выпуски GitHub предварительным выпуском v<номер>-dev,
# откуда её ставят install.ps1 и кнопка «Обновить». Номер — номер выпуска 0.X.Y из version.txt и номер сборки
# Беты этого выпуска четвёртым числом: 0.28.0.1, 0.28.0.2… В Стабильный Бета уходит не отсюда, а выкладкой
# признанной сборки — promote.yml.
name: Выпуск панели

on:
  push:
    branches: [dev]

permissions:
  contents: write

# Приходы в dev не выпускаются наперегонки за один номер сборки. Ждать своей очереди GitHub оставляет только
# последнему: пришло третье, пока выпускается первое, — ждавшее второе отменяется, его номер сборки выпуском
# не выходит, а его задачи попадают в описание третьего — перечень считается от прошлого выпуска.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # Вся история и теги: номер сборки и перечень задач считаются от прошлых выпусков.
          fetch-depth: 0

      - name: Номер и тег выпуска
        id: release
        run: |
          # У этого кода Бета уже есть — повторный запуск второй не выпускает.
          $existing = git tag --points-at HEAD --list 'v*-dev'
          if ($existing) {
            Write-Output "::notice::Бета этого кода уже вышла: $existing"
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $release = (Get-Content version.txt -Raw).Trim()
          if ($release -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::В version.txt «$release», а нужен номер выпуска из трёх чисел 0.X.Y"
            exit 1
          }
          $pattern = '^v' + [regex]::Escape($release) + '\.(\d+)-dev$'
          $built = @(git tag --list "v$release.*-dev" | Where-Object { $_ -match $pattern } | ForEach-Object { [int]($_ -replace $pattern, '$1') })
          $build = 1 + ($built | Measure-Object -Maximum).Maximum
          $version = "$release.$build"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version-dev" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        if: steps.release.outputs.skip != 'true'
        with:
          global-json-file: backend/global.json

      - name: Сборка
        if: steps.release.outputs.skip != 'true'
        run: |
          ./scripts/build.ps1 -Output build/agents-kit-web -Channel dev -Ref '${{ github.ref_name }}' `
            -Releases '${{ github.repository }}' -Version '${{ steps.release.outputs.version }}'
          Compress-Archive -Path build/agents-kit-web/* -DestinationPath build/agents-kit-web-win-x64.zip

      - name: Перечень задач
        if: steps.release.outputs.skip != 'true'
        run: ./scripts/release-notes.ps1 -Channel dev | Set-Content build/notes.md -Encoding utf8NoBOM

      - name: Выпуск
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.release.outputs.tag }}' build/agents-kit-web-win-x64.zip `
            --target '${{ github.sha }}' --title '${{ steps.release.outputs.version }}' `
            --notes-file build/notes.md --prerelease
